<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy Robertson: Learning through making</title>
  <meta name="description" content="Material exploration in content design and information architecture.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Set the saved theme before first paint, so the page doesn't flash.
    try {
      var saved = localStorage.getItem('weft-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  </script>
  <style>
    /* Weft design system v0.4: C5, C6 colours; Section 4 type (Arial). */
    :root {
      --paper: #FBFAF9;
      --ink: #20241F;
      --accent: #D9491F;
      --fill: rgba(32, 36, 31, 0.04);
      --edge: rgba(32, 36, 31, 0.18);
      --lift: rgba(32, 36, 31, 0.14);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #1B1E1A;
        --ink: #F4F2ED;
        --fill: rgba(244, 242, 237, 0.06);
        --edge: rgba(244, 242, 237, 0.22);
        --lift: rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #1B1E1A;
      --ink: #F4F2ED;
      --fill: rgba(244, 242, 237, 0.06);
      --edge: rgba(244, 242, 237, 0.22);
      --lift: rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.125rem;          /* 18px: T1 */
      line-height: 1.5;             /* T4 */
    }

    .page {
      width: 100%;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
    }

    /* Links: ink text, orange underline. Orange text on paper is only ~4:1,
       below the 4.5:1 that body-size text needs, so orange marks the
       action (C4) without carrying the words. */
    a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.2em;
    }
    a:hover { text-decoration-thickness: 4px; }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* Wordmark: L8, regular weight, modest size. */
    header { padding-block: 1.5rem 0; }
    .wordmark {
      font-size: 1.125rem;
      font-weight: 400;
      text-decoration: none;
      display: inline-block;
      padding-block: 0.5rem;
    }
    .wordmark:hover { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }

    main {
      flex: 1;
      max-width: 66ch;              /* T3 */
      padding-block: clamp(3rem, 12vh, 7rem) 4rem;
    }

    /* Hero: L7, ~39px, regular weight, line-height 1.2; T8 tighter tracking. */
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 1.4rem + 2.5vw, 2.4375rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    /* Subtitle: a sentence of intro text, not a heading, so it is a paragraph. T5. */
    .subtitle {
      margin: 0 0 clamp(3rem, 8vh, 4.5rem);
      line-height: 1.35;
    }

    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;            /* hierarchy from size and space: L3 */
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.005em;
    }

    section + section { margin-top: 2.5rem; }

    ul { list-style: none; margin: 0; padding: 0; }
    li a { display: inline-block; padding-block: 0.5rem; }

    footer {
      padding-block: 1.5rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 2rem;
      justify-content: space-between;
    }
    footer p { margin: 0; }

    /* Toggle: interactive chrome, so the pill treatment from L6. */
    .toggle {
      font: inherit;
      color: var(--ink);
      background: var(--fill);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid var(--edge);
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      min-height: 44px;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .toggle:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--lift); }
    .toggle[aria-pressed="true"] { border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .toggle { transition: none; }
      .toggle:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/">Andy Robertson</a>
    </header>

    <main>
      <h1>Learning through making</h1>
      <p class="subtitle">Material exploration in content design and information architecture</p>

      <section aria-labelledby="work">
        <h2 id="work">Work</h2>
        <ul>
          <li><a href="/plain-jane/">Plain Jane</a></li>
          <li><a href="/signals/">Signals</a></li>
        </ul>
      </section>

      <section aria-labelledby="writing">
        <h2 id="writing">Writing</h2>
        <ul>
          <li><a href="https://medium.com/@andy.robertson.design">Medium</a></li>
          <li><a href="https://www.linkedin.com/in/andyrobertsondesign">LinkedIn</a></li>
        </ul>
      </section>
    </main>

    <footer>
      <p>Andy Robertson is a designer based in Glasgow, Scotland. 2026.</p>
      <button class="toggle" type="button" id="theme-toggle" aria-pressed="false" hidden>Dark mode</button>
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');
      var query = window.matchMedia('(prefers-color-scheme: dark)');

      function isDark() {
        var set = root.getAttribute('data-theme');
        return set ? set === 'dark' : query.matches;
      }
      function show() { button.setAttribute('aria-pressed', String(isDark())); }

      button.hidden = false;   // only show the toggle when script can run
      show();

      button.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('weft-theme', next); } catch (e) {}
        show();
      });

      var onChange = function () { if (!root.getAttribute('data-theme')) show(); };
      if (query.addEventListener) query.addEventListener('change', onChange);
    })();
  </script>
</body>
</html>
